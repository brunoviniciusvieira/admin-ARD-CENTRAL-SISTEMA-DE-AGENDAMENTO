<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estacionamento | ARD CENTRAL</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f172a; color: #f1f5f9; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 520px; padding: 40px 24px; text-align: center; background: #1e293b; border: 1px solid #334155; border-top: 4px solid #3b82f6; border-radius: 20px; }
    .marca { color: #93c5fd; font-size: 12px; font-weight: 700; letter-spacing: .2em; }
    h1 { margin: 24px 0 12px; font-size: clamp(24px, 6vw, 32px); }
    p { color: #cbd5e1; }
    a { display: inline-block; margin-top: 24px; padding: 12px 20px; border-radius: 12px; background: #2563eb; color: white; text-decoration: none; font-weight: 600; }
    a:hover { background: #1d4ed8; }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="marca">ARD CENTRAL</div>
    <h1>Estacionamento</h1>
    <p>Em desenvolvimento</p>
    <a href="index.html">Voltar ao painel</a>
  </main>
</body>
</html>
